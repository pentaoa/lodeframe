pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'lodeframe'

include 'lodeframe-shaders'
project(':lodeframe-shaders').projectDir = file('modules/lodeframe-shaders')
